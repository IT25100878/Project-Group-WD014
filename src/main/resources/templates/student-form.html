<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${student.id} ? 'Edit Student' : 'New Student'">Student Form</h2>
    <form th:action="@{/students/save}" method="post">
        <input type="hidden" name="id" th:value="${student.id}" />

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" th:value="${student.name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" name="phone" th:value="${student.phone}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>NIC</label>
            <input type="text" name="nic" th:value="${student.nic}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Address</label>
            <input type="text" name="address" th:value="${student.address}" class="form-control">
        </div>

        <div class="mb-3">
            <label>License Type</label>
            <select name="licenseType" class="form-control">
                <option value="Auto" th:selected="${student.licenseType == 'Auto'}">Auto</option>
                <option value="Manual" th:selected="${student.licenseType == 'Manual'}">Manual</option>
                <option value="Heavy" th:selected="${student.licenseType == 'Heavy'}">Heavy</option>
                <option value="Bike" th:selected="${student.licenseType == 'Bike'}">Bike</option>
                <option value="Auto/Manual/Heavy and Bike" th:selected="${student.licenseType == 'Auto/Manual/Heavy and Bike'}">Auto/Manual/Heavy and Bike</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="Active" th:selected="${student.status == 'Active'}">Active</option>
                <option value="Completed" th:selected="${student.status == 'Completed'}">Completed</option>
                <option value="Dropped" th:selected="${student.status == 'Dropped'}">Dropped</option>
            </select>
        </div>

        <!-- PASSWORD FIELD (required) -->
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" th:value="${student.password}" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a href="/students" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
