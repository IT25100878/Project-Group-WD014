<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Schedule Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${schedule.id} ? 'Edit Schedule' : 'New Schedule'">Form</h2>
    <form th:action="@{/schedules/save}" method="post">
        <input type="hidden" name="id" th:value="${schedule.id}" />
        <div class="mb-3">
            <label>Student</label>
            <select name="studentId" class="form-control" required>
                <option value="">-- Select Student --</option>
                <option th:each="s : ${students}"
                        th:value="${s.id}"
                        th:text="${s.id} + ' - ' + ${s.name}"
                        th:selected="${schedule.studentId == s.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Instructor</label>
            <select name="instructorId" class="form-control" required>
                <option value="">-- Select Instructor --</option>
                <option th:each="i : ${instructors}"
                        th:value="${i.id}"
                        th:text="${i.id} + ' - ' + ${i.name}"
                        th:selected="${schedule.instructorId == i.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Vehicle</label>
            <select name="vehicleId" class="form-control" required>
                <option value="">-- Select Vehicle --</option>
                <option th:each="v : ${vehicles}"
                        th:value="${v.id}"
                        th:text="${v.id} + ' - ' + ${v.regNo} + ' (' + ${v.model} + ')'"
                        th:selected="${schedule.vehicleId == v.id}">
                </option>
            </select>
        </div>
        <div class="mb-3">
            <label>Start Time</label>
            <input type="datetime-local" name="startTime" th:value="${startTimeStr}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>End Time</label>
            <input type="datetime-local" name="endTime" th:value="${endTimeStr}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="Booked" th:selected="${schedule.status == 'Booked'}">Booked</option>
                <option value="Completed" th:selected="${schedule.status == 'Completed'}">Completed</option>
                <option value="Cancelled" th:selected="${schedule.status == 'Cancelled'}">Cancelled</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/schedules" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
