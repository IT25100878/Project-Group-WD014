<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-header { font-weight: bold; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1>Welcome, <span th:text="${student.name}"></span></h1>
        <a href="/student/logout" class="btn btn-danger">Logout</a>
    </div>
    <hr>

    <!-- Profile Card -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-info text-white">My Profile</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6"><strong>ID:</strong> <span th:text="${student.id}"></span></div>
                <div class="col-md-6"><strong>Name:</strong> <span th:text="${student.name}"></span></div>
                <div class="col-md-6"><strong>NIC:</strong> <span th:text="${student.nic}"></span></div>
                <div class="col-md-6"><strong>Phone:</strong> <span th:text="${student.phone}"></span></div>
                <div class="col-md-6"><strong>Address:</strong> <span th:text="${student.address}"></span></div>
                <div class="col-md-6"><strong>License Type:</strong> <span th:text="${student.licenseType}"></span></div>
                <div class="col-md-6"><strong>Status:</strong> <span th:text="${student.status}"></span></div>
            </div>
        </div>
    </div>

    <!-- Schedules -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">My Lesson Schedules</div>
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr><th>Schedule ID</th><th>Instructor ID</th><th>Vehicle ID</th><th>Start Time</th><th>End Time</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${schedules}">
                    <td th:text="${s.id}"/><td th:text="${s.instructorId}"/>
                    <td th:text="${s.vehicleId}"/><td th:text="${s.startTime}"/>
                    <td th:text="${s.endTime}"/><td th:text="${s.status}"/>
                </tr>
                <tr th:if="${schedules.isEmpty()}">
                    <td colspan="6" class="text-center text-muted">No schedules found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Payments -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-success text-white">My Payment History</div>
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr><th>Payment ID</th><th>Package ID</th><th>Amount (LKR)</th><th>Payment Date</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td th:text="${p.id}"/><td th:text="${p.packageId}"/>
                    <td th:text="${p.amount}"/><td th:text="${p.paymentDate}"/><td th:text="${p.status}"/>
                </tr>
                <tr th:if="${payments.isEmpty()}">
                    <td colspan="5" class="text-center text-muted">No payments found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="text-center mt-3">
        <a href="/student/logout" class="btn btn-secondary">Logout</a>
    </div>
</div>
</body>
</html>
