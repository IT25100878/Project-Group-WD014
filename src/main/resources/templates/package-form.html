<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Package Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${pkg.id} ? 'Edit Package' : 'New Package'">Form</h2>
    <form th:action="@{/packages/save}" method="post">
        <input type="hidden" name="id" th:value="${pkg.id}" />
        <div class="mb-3"><label>Name</label><input type="text" name="name" th:value="${pkg.name}" class="form-control" required></div>
        <div class="mb-3"><label>Number of Lessons</label><input type="number" name="lessonsCount" th:value="${pkg.lessonsCount}" class="form-control" required></div>
        <div class="mb-3"><label>Price (LKR)</label><input type="number" step="0.01" name="price" th:value="${pkg.price}" class="form-control" required></div>
        <div class="mb-3"><label>Description</label><textarea name="description" class="form-control" th:text="${pkg.description}"></textarea></div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/packages" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
