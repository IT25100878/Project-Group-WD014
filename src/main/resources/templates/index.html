<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Driving School System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border-radius: 20px; }
        .btn-primary { background-color: #667eea; border: none; }
        .btn-success { background-color: #11998e; border: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body p-5">
                    <h1 class="mb-4">Driving School System</h1>
                    <div class="d-grid gap-3">
                        <a href="/login" class="btn btn-primary btn-lg">Admin Login</a>
                        <a href="/student/login" class="btn btn-success btn-lg">Student Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
