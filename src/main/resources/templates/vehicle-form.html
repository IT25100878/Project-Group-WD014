<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vehicle Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${vehicle.id} ? 'Edit Vehicle' : 'New Vehicle'">Form</h2>
    <form th:action="@{/vehicles/save}" method="post">
        <input type="hidden" name="id" th:value="${vehicle.id}" />
        <div class="mb-3"><label>Registration Number</label><input type="text" name="regNo" th:value="${vehicle.regNo}" class="form-control" required></div>
        <div class="mb-3"><label>Model</label><input type="text" name="model" th:value="${vehicle.model}" class="form-control" required></div>
        <div class="mb-3"><label>Type</label>
            <select name="type" class="form-control">
                <option value="Car" th:selected="${vehicle.type == 'Car'}">Car</option>
                <option value="Motorcycle" th:selected="${vehicle.type == 'Motorcycle'}">Motorcycle</option>
            </select>
        </div>
        <div class="mb-3"><label>Fuel Type</label>
            <select name="fuelType" class="form-control">
                <option value="Petrol" th:selected="${vehicle.fuelType == 'Petrol'}">Petrol</option>
                <option value="Diesel" th:selected="${vehicle.fuelType == 'Diesel'}">Diesel</option>
                <option value="Electric" th:selected="${vehicle.fuelType == 'Electric'}">Electric</option>
            </select>
        </div>
        <div class="mb-3"><label>Status</label>
            <select name="status" class="form-control">
                <option value="Available" th:selected="${vehicle.status == 'Available'}">Available</option>
                <option value="Maintenance" th:selected="${vehicle.status == 'Maintenance'}">Maintenance</option>
                <option value="Assigned" th:selected="${vehicle.status == 'Assigned'}">Assigned</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/vehicles" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
