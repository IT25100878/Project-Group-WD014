<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Student Management</h2>
    <a href="/students/new" class="btn btn-primary mb-3">Add New Student</a>
    <!-- Search Form -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" action="/students" class="d-flex">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="Search by ID, Name, NIC, or Phone..."
                       th:value="${searchKeyword}">
                <button type="submit" class="btn btn-outline-primary">Search</button>
                <a href="/students" class="btn btn-outline-secondary ms-2">Clear</a>
            </form>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>Name</th><th>Phone</th><th>NIC</th><th>License Type</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}"/> <td th:text="${s.name}"/> <td th:text="${s.phone}"/>
            <td th:text="${s.nic}"/> <td th:text="${s.licenseType}"/> <td th:text="${s.status}"/>
            <td><a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/students/delete/{id}(id=${s.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
<script th:if="${param.error}">
    alert([[${param.error[0]}]]);
    // Remove the error parameter from the URL without reloading the page
    window.history.replaceState({}, document.title, window.location.pathname);
</script>
</body>
</html>
