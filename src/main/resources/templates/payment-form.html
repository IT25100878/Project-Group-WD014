<<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function autoFillAmount() {
            // Get the selected package option
            const packageSelect = document.getElementById('packageSelect');
            const selectedOption = packageSelect.options[packageSelect.selectedIndex];
            // Get the price from the data-price attribute
            const price = selectedOption.getAttribute('data-price');
            if (price) {
                document.getElementById('amount').value = price;
            } else {
                document.getElementById('amount').value = '';
            }
        }
    </script>
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${payment.id} ? 'Edit Payment' : 'New Payment'">Payment Form</h2>
    <form th:action="@{/payments/save}" method="post">
        <input type="hidden" name="id" th:value="${payment.id}" />

        <div class="mb-3">
            <label>Student</label>
            <select name="studentId" class="form-control" required>
                <option value="">-- Select Student --</option>
                <option th:each="s : ${students}"
                        th:value="${s.id}"
                        th:text="${s.id} + ' - ' + ${s.name}"
                        th:selected="${payment.studentId == s.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Package</label>
            <select id="packageSelect" name="packageId" class="form-control" required onchange="autoFillAmount()">
                <option value="">-- Select Package --</option>
                <option th:each="pkg : ${packages}"
                        th:value="${pkg.id}"
                        th:text="${pkg.name} + ' (' + ${pkg.lessonsCount} + ' lessons) - LKR ' + ${pkg.price}"
                        th:attr="data-price=${pkg.price}"
                        th:selected="${payment.packageId == pkg.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label>Amount (LKR)</label>
            <input type="number" step="0.01" id="amount" name="amount" th:value="${payment.amount}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Payment Date</label>
            <input type="date" name="paymentDate" th:value="${payment.paymentDate}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="Paid" th:selected="${payment.status == 'Paid'}">Paid</option>
                <option value="Pending" th:selected="${payment.status == 'Pending'}">Pending</option>
                <option value="Refunded" th:selected="${payment.status == 'Refunded'}">Refunded</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a href="/payments" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
