<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vehicle List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Vehicle Management</h2>
    <a href="/vehicles/new" class="btn btn-primary mb-3">Add New Vehicle</a>
    <!-- Search Form -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" action="/vehicles" class="d-flex">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="Search by ID, Reg No, Model, or Type..."
                       th:value="${searchKeyword}">
                <button type="submit" class="btn btn-outline-primary">Search</button>
                <a href="/vehicles" class="btn btn-outline-secondary ms-2">Clear</a>
            </form>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>Reg No</th><th>Model</th><th>Type</th><th>Fuel Type</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="v : ${vehicles}">
            <td th:text="${v.id}"/><td th:text="${v.regNo}"/><td th:text="${v.model}"/>
            <td th:text="${v.type}"/><td th:text="${v.fuelType}"/><td th:text="${v.status}"/>
            <td>
                <a th:href="@{/vehicles/edit/{id}(id=${v.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/vehicles/delete/{id}(id=${v.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
<script th:if="${param.error}">
    alert([[${param.error[0]}]]);
    // Remove the error parameter from the URL without reloading the page
    window.history.replaceState({}, document.title, window.location.pathname);
</script>
</body>
</html>
