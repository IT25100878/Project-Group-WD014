<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${admin.id} ? 'Edit Admin' : 'New Admin'">Form</h2>
    <form th:action="@{/admins/save}" method="post">
        <input type="hidden" name="id" th:value="${admin.id}" />
        <div class="mb-3"><label>Username</label><input type="text" name="username" th:value="${admin.username}" class="form-control" required></div>
        <div class="mb-3"><label>Password</label><input type="password" name="password" th:value="${admin.password}" class="form-control" required></div>
        <div class="mb-3"><label>Role</label>
            <select name="role" class="form-control">
                <option value="SuperAdmin" th:selected="${admin.role == 'SuperAdmin'}">SuperAdmin</option>
                <option value="Manager" th:selected="${admin.role == 'Manager'}">Manager</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/admins" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
