<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Admin Management</h2>
    <a href="/admins/new" class="btn btn-primary mb-3">Add New Admin</a>
    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>Username</th><th>Password</th><th>Role</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="a : ${admins}">
            <td th:text="${a.id}"/><td th:text="${a.username}"/><td th:text="${a.password}"/><td th:text="${a.role}"/>
            <td>
                <a th:href="@{/admins/edit/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/admins/delete/{id}(id=${a.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Delete?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
</body>
</html>
