<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Instructor Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${instructor.id} ? 'Edit Instructor' : 'New Instructor'">Form</h2>
    <form th:action="@{/instructors/save}" method="post">
        <input type="hidden" name="id" th:value="${instructor.id}" />
        <div class="mb-3"><label>Name</label><input type="text" name="name" th:value="${instructor.name}" class="form-control" required></div>
        <div class="mb-3"><label>Phone</label><input type="text" name="phone" th:value="${instructor.phone}" class="form-control" required></div>
        <div class="mb-3"><label>License No</label><input type="text" name="licenseNo" th:value="${instructor.licenseNo}" class="form-control" required></div>
        <div class="mb-3">
            <label>Specialization</label>
            <select name="specialization" class="form-control">
                <option value="Car" th:selected="${instructor.specialization == 'Car'}">Car</option>
                <option value="Van" th:selected="${instructor.specialization == 'Van'}">Van</option>
                <option value="Bike" th:selected="${instructor.specialization == 'Bike'}">Bike</option>
                <option value="Bus" th:selected="${instructor.specialization == 'Bus'}">Bus</option>
            </select>
        </div>
        <div class="mb-3"><label>Status</label>
            <select name="status" class="form-control">
                <option value="Available" th:selected="${instructor.status == 'Available'}">Available</option>
                <option value="Busy" th:selected="${instructor.status == 'Busy'}">Busy</option>
                <option value="Inactive" th:selected="${instructor.status == 'Inactive'}">Inactive</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/instructors" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
