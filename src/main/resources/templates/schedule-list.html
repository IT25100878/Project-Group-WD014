<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Schedule List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Lesson Schedule Management</h2>
    <a href="/schedules/new" class="btn btn-primary mb-3">Add New Schedule</a>
    <!-- Search Form -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" action="/schedules" class="d-flex">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="Search by ID, Student ID, Instructor ID, or Status..."
                       th:value="${searchKeyword}">
                <button type="submit" class="btn btn-outline-primary">Search</button>
                <a href="/schedules" class="btn btn-outline-secondary ms-2">Clear</a>
            </form>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Student ID</th>
            <th>Instructor ID</th>
            <th>Vehicle ID</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${schedules}">
            <td th:text="${s.id}"/><td th:text="${s.studentId}"/><td th:text="${s.instructorId}"/>
            <td th:text="${s.vehicleId}"/><td th:text="${s.startTime}"/><td th:text="${s.endTime}"/>
            <td th:text="${s.status}"/>
            <td>
                <a th:href="@{/schedules/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/schedules/delete/{id}(id=${s.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete schedule?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
<script th:if="${param.error}">
    alert([[${param.error[0]}]]);
    // Remove the error parameter from the URL without reloading the page
    window.history.replaceState({}, document.title, window.location.pathname);
</script>
</body>
</html>
