<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Payment Management</h2>
    <a href="/payments/new" class="btn btn-primary mb-3">Add New Payment</a>
    <!-- Search Form -->
    <div class="row mb-3">
        <div class="col-md-6">
            <form method="get" action="/payments" class="d-flex">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="Search by ID, Student ID, Package ID, or Status..."
                       th:value="${searchKeyword}">
                <button type="submit" class="btn btn-outline-primary">Search</button>
                <a href="/payments" class="btn btn-outline-secondary ms-2">Clear</a>
            </form>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Student ID</th>
            <th>Package ID</th>
            <th>Amount (LKR)</th>
            <th>Payment Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${payments}">
            <td th:text="${p.id}"/><td th:text="${p.studentId}"/>
            <td th:text="${p.packageId}"/><td th:text="${p.amount}"/>
            <td th:text="${p.paymentDate}"/><td th:text="${p.status}"/>
            <td>
                <a th:href="@{/payments/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/payments/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this payment?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
</div>
<script th:if="${param.error}">
    alert([[${param.error[0]}]]);
    // Remove the error parameter from the URL without reloading the page
    window.history.replaceState({}, document.title, window.location.pathname);
</script>
</body>
</html>
